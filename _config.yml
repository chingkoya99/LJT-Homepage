# Group publications by category on the publications page.
publication_category:
  conferences:
    title: "Conferences"
  journals:
    title: "Journals"
  workshops:
    title: "Workshops"
  preprints:
    title: "Preprints"

# Collections
collections:
  posts:
    output: true
  publications:
    output: true
    permalink: /:collection/:name
  talks:
    output: true
    permalink: /:collection/:name
  teaching:
    output: true
    permalink: /:collection/:name
  portfolio:
    output: true
    permalink: /:collection/:name

# Default layouts for each content type
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: "single"
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_publications"
      type: publications
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true
  - scope:
      path: "_talks"
      type: talks
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true
  - scope:
      path: "_teaching"
      type: teaching
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true
  - scope:
      path: "_portfolio"
      type: portfolio
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true

# Build settings
markdown: kramdown
highlighter: rouge
mathjax: true
timezone: UTC
encoding: utf-8

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate

# Blog / pagination settings
paginate: 5
paginate_path: /blog/page:num
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "\n\n"

# Other build flags
future: true
lsi: false
safe: false
incremental: false

include:
  - _pages

exclude:
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - tailwind.config.js
  - postcss.config.js
  - webpack.config.js
  - docker-compose.yml
  - Dockerfile
  - Makefile
  - Rakefile

keep_files:
  - .git
  - .svn
