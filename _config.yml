# This sets the category for the publications
#
# This makes the website group publications by category. You can
# remove this to just list them all in one group.
publication_category:
  conferences:
    title: "Conferences"
  journals:
    title: "Journals"
  workshops:
    title: "Workshops"
  preprints:
    title: "Preprints"

# Collections
#
# Only some of the collections are used at the same time (due to the
# fact that pagination is not supported in nested folders), but
# everything else works fine.
collections:
  posts:
    output: true
  publications:
    output: true
    permalink: /:collection/:name
  talks:
    output: true
    permalink: /:collection/:name
  teaching:
    output: true
    permalink: /:collection/:name
  portfolio:
    output: true
    permalink: /:collection/:name

# This sets the layout defaults
#
# This makes sure that the right layout is used for the right
# type of content. You should not need to change this.
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: "single"
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_publications"
      type: publications
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true
  - scope:
      path: "_talks"
      type: talks
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true
  - scope:
      path: "_teaching"
      type: teaching
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true
  - scope:
      path: "_portfolio"
      type: portfolio
    values:
      layout: "single"
      author_profile: false
      comments: true
      share: true

# Build settings
markdown: kramdown
# highlighter: rouge
# highlighter: pygments
highlighter: rouge

# This allows the use of MathJax for math equations
#
# If you are not using MathJax, you can set this to false
mathjax: true

# This sets the markdown converter
#
# You can change this to another markdown converter if you would like,
# but kramdown is the default and is supported by the theme.
# markdown: kramdown

# This sets the syntax highlighter
#
# Rouge is the default and is supported by the theme.
# highlighter: rouge

# This sets the time zone
#
# If you are not in the United States, you can change this to your
# time zone. The default is UTC.
timezone: UTC

# This sets the encoding
encoding: utf-8

# This sets the plugins
#
# The plugins are used for the feed, sitemap, gist, seo, and
# pagination. You should not need to change this.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate

# This sets the pagination
#
# If you are not using pagination, you can set this to false
paginate: 5
paginate_path: /blog/page:num

# This sets the permalink for posts
#
# The default is /blog/:year/:month/:day/:title/
permalink: /blog/:year/:month/:day/:title/

# This sets the default excerpt separator
excerpt_separator: "\n\n"

# This sets the base url for the site
#
# The base url is used for the links in the feed and sitemap.
# If you are using a custom domain, you can set this to the
# domain name.
baseurl: "/LJT-Homepage"

# This sets the url for the site
#
# The url is used for the links in the feed and sitemap.
# If you are using a custom domain, you can set this to the
# domain name.
